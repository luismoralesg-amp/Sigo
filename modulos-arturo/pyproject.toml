[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigo-modulos"
version = "0.1.0"
description = "Módulos de Arturo para SIGO: visión, importar, CAG y exportar."
requires-python = ">=3.11"
dependencies = [
  "openpyxl==3.1.5",
  "weasyprint==70.0",
  "httpx>=0.27.0",
  "xlrd>=2.0",
  "xlwt>=1.3",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]
fixtures = ["Pillow>=10"]

[tool.setuptools.packages.find]
include = ["sigo_modulos*", "cag*"]
exclude = ["cag.tests*"]

[tool.pytest.ini_options]
testpaths = ["vision/tests", "importar/tests", "tests", "cag/tests"]
pythonpath = ["."]
